<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 To-Do List</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="todo-card">
    <header class="card-header">
      <p class="eyebrow">MY DAILY PLANNER</p>
      <h1>오늘의 할 일 <span>✦</span></h1>
      <p class="subtitle">하나씩 완료하며 오늘을 채워보세요.</p>
    </header>

    <form class="input-area" onsubmit="event.preventDefault(); addTodo();">
      <label for="todoInput" class="sr-only">새로운 할 일</label>
      <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요" autocomplete="off">
      <button type="submit" class="add-button">+ 추가</button>
    </form>

    <div class="summary" aria-live="polite">
      <span>전체 <strong id="totalCount">0</strong>개</span>
      <span class="summary-divider"></span>
      <span>완료 <strong id="doneCount">0</strong>개</span>
    </div>

    <section class="list-section" aria-label="할 일 목록">
      <div class="section-heading">
        <h2>할 일 목록</h2>
        <p>할 일을 누르면 완료돼요</p>
      </div>
      <p id="emptyState" class="empty-state">아직 등록된 할 일이 없어요.<br>첫 번째 할 일을 추가해 보세요!</p>
      <ul id="todoList" class="todo-list"></ul>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
